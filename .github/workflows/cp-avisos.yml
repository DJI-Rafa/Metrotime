name: Scrape CP Avisos

# O GitHub só lê workflows em .github/workflows na RAIZ do repositório
# (antes estava em scripts/.github/workflows e nunca corria).
on:
  schedule:
    # De meia em meia hora (UTC). Já não abre um browser: é um pedido JSON ao site da CP.
    - cron: '7,37 * * * *'
  workflow_dispatch: # Permite correr manualmente no GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts

    steps:
    - name: Fazer Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Criar ficheiro Service Account (Firebase)
      env:
        FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET_JSON }}
      run: |
        echo "$FIREBASE_SECRET" > serviceAccountKey.json

    - name: Correr o Scraper
      run: python cp_scraper.py
